name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elixir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17.3'
            otp: '27.0.1'
          - elixir: '1.20.5'
            otp: '29.1.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - run: mix credo --strict
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
      - run: mix hex.audit
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B scripts/check_sources.py
      - run: python3 -B scripts/check_package.py
      - run: python3 -B scripts/check_examples.py
  peers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.5'
          otp-version: '29.1.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: npm ci --prefix test/interop --ignore-scripts --no-audit --no-fund
      - run: python3 -B scripts/qualify.py interop
      - run: python3 -B scripts/qualify.py conformance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: a2a-qualification
          path: reports/
          if-no-files-found: error
